<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    </pattern>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Decorative elements - subtle geometric shapes -->
  <circle cx="100" cy="150" r="180" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.1"/>
  <circle cx="100" cy="150" r="220" fill="none" stroke="#3b82f6" stroke-width="0.3" opacity="0.08"/>
  <circle cx="1100" cy="150" r="200" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.1"/>
  <circle cx="1100" cy="150" r="250" fill="none" stroke="#8b5cf6" stroke-width="0.3" opacity="0.08"/>
  
  <!-- Accent line -->
  <line x1="200" y1="200" x2="400" y2="200" stroke="#3b82f6" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Main text - Name -->
  <text x="200" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Harsh Daga
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    Cloud Engineer · DevOps · Building Scalable Infrastructure
  </text>
  
  <!-- Tech tags -->
  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#64748b">
    <text x="200" y="240">AWS</text>
    <text x="200" y="240" fill="#475569"> · </text>
    <text x="240" y="240">Azure</text>
    <text x="240" y="240" fill="#475569"> · </text>
    <text x="295" y="240">GCP</text>
    <text x="295" y="240" fill="#475569"> · </text>
    <text x="340" y="240">Terraform</text>
    <text x="340" y="240" fill="#475569"> · </text>
    <text x="425" y="240">Kubernetes</text>
    <text x="425" y="240" fill="#475569"> · </text>
    <text x="520" y="240">Python</text>
  </g>
  
  <!-- Simple decorative dots -->
  <circle cx="1000" cy="80" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="1020" cy="100" r="2" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="1040" cy="75" r="2.5" fill="#06b6d4" opacity="0.5"/>
  
</svg>
