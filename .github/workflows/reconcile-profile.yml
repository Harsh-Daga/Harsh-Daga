name: Reconcile profile

on:
  push:
    paths:
      - profile.yaml
      - generate.py
      - templates/**
      - .github/workflows/reconcile-profile.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile desired profile state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate.py --refresh
      - name: Commit changed generated state
        run: |
          git diff --quiet || {
            git config user.name "harsh-control-plane[bot]"
            git config user.email "harsh-control-plane[bot]@users.noreply.github.com"
            git add README.md assets .profile-state.json
            git commit -m "chore(profile): reconcile generated state"
            git push
          }
