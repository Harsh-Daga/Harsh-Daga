name: Update latest Medium post

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest post into README
        uses: gautamkrishnar/blog-post-workflow@v2
        with:
          feed_list: "https://medium.com/feed/@harshdaga18"
          max_post_count: 1
          comment_tag_name: "LATEST_POST"
